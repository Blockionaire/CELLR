name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *" # nightly: the long end-to-end run
  workflow_dispatch: # or by hand, from the Actions tab
    inputs:
      features:
        description: "End to end against the server with every Wine Intelligence feature on"
        type: choice
        options: ["off", "on"]
        default: "off"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The local stack (Postgres + PostgREST + fake Auth) needs no secrets; these are its throwaway keys.
  NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_localstack_0000000000

jobs:
  checks:
    name: Format · lint · types · unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # The end-to-end suite runs as two suites in CI (the e2e and e2e-3d jobs below): together they must be exactly
      # the whole suite, so no test is left out or run twice when a spec is added or renamed. Lists only; runs nothing.
      - name: End-to-end suites together are the whole suite
        run: node apps/web/scripts/e2e-suites-check.mjs
      # Next also type-checks the e2e files; this is what the e2e job used to catch on every pull request.
      - run: pnpm build
      - name: No server secrets in the browser bundle
        run: bash scripts/check-bundle-secrets.sh
      - name: Generated files are up to date
        run: |
          pnpm db:types:check
          pnpm offline-page
          git diff --exit-code -- apps/web/public/offline.html

  migration-integrity:
    # A migration that is on the base branch may already have run in production: it is never edited, removed or
    # renamed; changes go in a new migration (docs/MIGRATIONS.md). Make this a required check in branch protection.
    name: Migration integrity · applied migrations are never changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # the guard needs the merge base with the base branch
      - name: The guard's own tests
        run: bash scripts/check-migration-immutability.test.sh
      - name: No migration on the base branch was changed, removed or renamed
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            bash scripts/check-migration-immutability.sh "origin/$BASE_REF"
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            bash scripts/check-migration-immutability.sh "$BEFORE"
          else
            echo "nothing to compare with for a $EVENT run"
          fi

  database:
    name: Database · migrations + permission suite (Postgres 16)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/db-test.sh
      # Smart Cellar 3D: placement, resizing, zones and swaps from many sessions at once (with the two-session
      # reproduction of the zone deadlock), and the migrations on a database that already holds a cellar.
      - name: Placement, zones and swaps under concurrency
        run: bash scripts/db-placement-concurrency.sh
      - name: Upgrade rehearsal · existing places and bottles are not touched
        run: bash scripts/db-smart-cellar-upgrade.sh

  e2e:
    name: End to end · shard ${{ matrix.shard }} of ${{ strategy.job-total }}
    # The long one: not on every pull request, but on main, nightly and on demand.
    #
    # The whole suite (about 1,270 tests on two projects) takes nearly four hours of test time, so it is split into
    # shards that run side by side, each with its own local stack, its own database and the same build. It runs as two
    # suites (playwright.config.ts, THREE_D_SPECS; issue #77): this job takes every spec that does not draw a 3D scene
    # (E2E_SUITE=core), the next one the 3D specs (E2E_SUITE=3d). The 3D specs are a quarter of the tests and half of
    # the time, and a shard takes tests by count and in file order, so in one suite they piled up in the last shard
    # until it ran into the time limit below. The checks job proves the two suites together are the whole suite.
    # Every shard must finish well inside the limit: if a suite grows until one does not, add a shard to that suite's
    # matrix (the number in `--shard` follows by itself).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      # one red shard says which tests failed; the others still report theirs
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cellr/web exec playwright install --with-deps chromium
      - run: pnpm build
      - name: No server secrets in the browser bundle
        run: bash scripts/check-bundle-secrets.sh
      - run: pnpm --filter @cellr/web e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          CI: "1"
          E2E_SUITE: core
          # By hand only (Actions → CI → Run workflow → "features: on"): the same suite against the server that has
          # every Wine Intelligence feature switched on. The check to run before a feature is switched on for people.
          E2E_BASE_URL: ${{ inputs.features == 'on' && 'http://localhost:3101' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results-${{ matrix.shard }}
          path: |
            apps/web/test-results
            apps/web/playwright-report
          retention-days: 7

  e2e-3d:
    name: End to end · 3D · shard ${{ matrix.shard }} of ${{ strategy.job-total }}
    # The specs that draw with software WebGL (E2E_SUITE=3d), with shards of their own: one test takes 10 s to 5
    # minutes here, so they get more, smaller shards than the rest. Same steps, same build, same limit.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cellr/web exec playwright install --with-deps chromium
      - run: pnpm build
      - name: No server secrets in the browser bundle
        run: bash scripts/check-bundle-secrets.sh
      - run: pnpm --filter @cellr/web e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          CI: "1"
          E2E_SUITE: 3d
          E2E_BASE_URL: ${{ inputs.features == 'on' && 'http://localhost:3101' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results-3d-${{ matrix.shard }}
          path: |
            apps/web/test-results
            apps/web/playwright-report
          retention-days: 7

  e2e-result:
    name: End to end · whole app against the local stack
    # One name to look at (and to require): green only when every shard of both suites was.
    if: always() && github.event_name != 'pull_request'
    needs: [e2e, e2e-3d]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: |
          [ "${{ needs.e2e.result }}" = "success" ] || { echo "at least one shard failed or was cancelled"; exit 1; }
          [ "${{ needs.e2e-3d.result }}" = "success" ] || { echo "at least one 3D shard failed or was cancelled"; exit 1; }

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # The gate's own tests: deterministic, on fixed reports (one of them a real, recorded pnpm audit report), so this
      # step never turns red because the registry published or withdrew an advisory today (GHSA-fc5q-39xc-vjpf was
      # withdrawn on 2026-11-18). The live registry is asked by the next step, the real audit, which blocks every high
      # or critical advisory without an exception.
      - name: The audit gate's own tests
        run: bash scripts/audit/check-audit.test.sh
      # `pnpm audit --prod` in full, then the gate: every high or critical advisory fails, except what a scoped,
      # expiring entry in scripts/audit/audit-exceptions.json covers completely (docs/sprints/wine-intelligence-mega/
      # CI_EXCEPTIONS_0042.md, E1).
      - name: pnpm audit --prod, high and critical gate
        run: bash scripts/audit/check-audit.sh

  supabase-stack:
    # The same permission suite against the REAL Supabase stack (GoTrue, Storage, Realtime, …).
    # The suite is verified on plain Postgres; this job checks the parts a shim cannot — Supabase's own
    # roles, Storage and extensions. Green on its first run, so it is a normal job now: add it to the
    # required checks in the branch protection settings.
    name: Database · real Supabase stack
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: 2.120.0 }
      - run: supabase start # applies supabase/migrations and supabase/seed
      - run: DB_TEST_MODE=supabase DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres bash scripts/db-test.sh
      # Storage policies through the Storage API, and account deletion through the Auth admin API.
      - run: node scripts/real-stack-smoke.mjs
      - if: always()
        run: supabase stop --no-backup

  backup-recovery:
    # docs/BACKUP-RECOVERY.md §8. Synthetic files and rows only, on two local Supabase stacks: the Storage backup tool
    # against real Supabase Storage (backup, verify, restore into a second stack, read back, conflicts, rows without
    # files, refusals, encrypted archive), and the database dump-and-restore rehearsal (schema fingerprint and row
    # counts must be equal; it caught the official restore widening privileges). Never touches a hosted project.
    name: Backup & recovery · real Supabase round trip
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: age, for the encrypted-archive check
        run: sudo apt-get update -q && sudo apt-get install -y -q age
      - run: pnpm exec supabase start -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Storage backup → verify → restore into a second stack
        run: pnpm --filter @cellr/storage-backup real-stack
      - name: Database dump → restore rehearsal
        run: bash scripts/db-backup/rehearse-restore.sh
      - if: always()
        run: pnpm exec supabase stop --no-backup
