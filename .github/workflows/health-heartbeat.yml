name: Health heartbeat

# System Intelligence sprint 2 (docs/sprints/system-health/ADR-002-live-monitoring.md, OPERATIONS.md).
#
# From outside CELLR (by hand here; on a schedule only from a private repository, see `on:` below):
#   1. Is the app alive? GET /api/health (public, no detail).
#   2. Run one round of health checks: GET /api/cron/health with the round secret. The app measures and stores; this
#      job only learns whether the round was recorded and how many infrastructure checks failed (never which).
# The primary trigger and alert are an external uptime provider (OPERATIONS.md §3). This workflow is the manual check
# of that setup, and the template for a scheduled heartbeat in a private repository.
#
# INACTIVE UNTIL SWITCHED ON. It runs only when the repository VARIABLE `HEALTH_HEARTBEAT` is `on`, and then needs the
# repository SECRETS `HEALTH_BASE_URL` (the production https address, no trailing slash) and `HEALTH_CRON_SECRET`
# (the app's CELLR_HEALTH_ROUND_SECRET, or its CRON_SECRET when that is not set). Until the variable is set every
# run is skipped and nothing is called.
#
# No third-party actions, no checkout, no token permissions: curl and jq on the runner. A run's log is public here,
# so it prints pass or fail and nothing else: no status code, reason or count.

on:
  # No schedule in this (public) repository, by the owner's choice: a scheduled run's pass/fail history would show
  # anyone when CELLR had trouble. Rounds are triggered by an external uptime provider instead (OPERATIONS.md §3).
  # Run by hand to check the setup; to schedule it, copy this file into a PRIVATE repository and add
  #   schedule: [{ cron: "*/10 * * * *" }]
  workflow_dispatch:

permissions: {}

concurrency:
  group: health-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    name: Heartbeat · liveness and one round of checks
    if: vars.HEALTH_HEARTBEAT == 'on'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      BASE: ${{ secrets.HEALTH_BASE_URL }}
      SECRET: ${{ secrets.HEALTH_CRON_SECRET }}
    steps:
      - name: Configuration is complete
        run: |
          if [ -z "$BASE" ] || [ -z "$SECRET" ]; then
            echo "::error::HEALTH_HEARTBEAT is on, but the secrets HEALTH_BASE_URL and HEALTH_CRON_SECRET are not both set"
            exit 1
          fi
          case "$BASE" in
            https://*) ;;
            *) echo "::error::HEALTH_BASE_URL must start with https://"; exit 1 ;;
          esac

      # THE LOG IS PUBLIC (a public repository): it says pass or fail and nothing else. No status code, reason or
      # count is printed, so the run history shows no more than whether CELLR answered; the details are on
      # Admin › System › Health. Every value taken from an answer is reduced to digits or a fixed word first.
      - name: The app answers (GET /api/health)
        run: |
          code=$(curl -sS --max-time 15 --retry 2 --retry-delay 10 --retry-all-errors \
            -o /dev/null -w '%{http_code}' "${BASE%/}/api/health" 2>/dev/null || echo 000)
          if [ "$code" != 200 ]; then
            echo "::error::Heartbeat failed. Details: Admin › System › Health, or check the app yourself (OPERATIONS.md §3)."
            exit 1
          fi
          echo "ok"

      - name: One round of health checks (GET /api/cron/health)
        run: |
          code=$(curl -sS --max-time 40 -o round.json -w '%{http_code}' \
            -H "Authorization: Bearer $SECRET" "${BASE%/}/api/cron/health" 2>/dev/null || echo 000)
          code=$(printf '%s' "$code" | tr -cd '0-9')
          failed=$(jq -r 'if (.failedInfrastructure | type) == "number" then .failedInfrastructure else 0 end' \
            round.json 2>/dev/null | tr -cd '0-9' || true)
          rm -f round.json
          # 200 = a round was recorded, or one ran less than a minute ago (its findings count here too)
          if [ "$code" != 200 ] || [ "${failed:-0}" -gt 0 ]; then
            echo "::error::Heartbeat failed. Details: Admin › System › Health, or check the app yourself (OPERATIONS.md §3)."
            exit 1
          fi
          echo "ok"
