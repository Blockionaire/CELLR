# Sprint 004C: the X-Wines pilot on the STAGING project (cellr-staging). Started by hand only; never on a schedule or a
# push. Every run waits for the owner's approval in the `cellr-staging` GitHub Environment, which also holds the only
# credentials (staging's, never production's). Before every write, scripts/catalog-tools/staging-guard.ts checks the
# ref typed below, the reviewed `main`, the environment, the approved project list and what the database itself says it
# is. Logs and artifacts carry counts only: no dataset record, no connection string, no key.
# Setup and use: docs/sprints/sprint-004c/STAGING_WORKFLOW.md
name: Staging catalogue (manual)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check = read-only; migrate = schema onto the new project; import = X-Wines pilot import and validation; scan = scan chain with a fictitious public source (rolled back); ratings = X-Wines ratings aggregated and imported (pilot); ratings-verify = read-only check of the imported ratings (no file, no import); pool-check = read-only: how many connections the pooler gives at once; perf16 = 16 concurrent people's searches over a synthetic public source (fail-closed); perf16-cleanup = switch the synthetic source off and check; perf-ladder = read-only: pilot search at 1, 2, 4, 8 and 16 concurrent searches over the X-Wines records, for the proposed release gate (reported, not enforced)"
        required: true
        type: choice
        options:
          [
            check,
            migrate,
            import,
            scan,
            ratings,
            ratings-verify,
            pool-check,
            perf16,
            perf16-cleanup,
            perf-ladder,
          ]
        default: check
      confirm_project_ref:
        description: "Type the staging project ref to confirm (must equal the environment's configured ref)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-catalog
  cancel-in-progress: false

jobs:
  staging:
    # reviewed code only: the main branch, started by hand
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: cellr-staging
    # no secret at job level: only the two steps below that need it ever see it (not install, not third-party actions)
    env:
      CELLR_ENVIRONMENT: cellr-staging
      STAGING_PROJECT_REF: ${{ vars.STAGING_PROJECT_REF }}
      CONFIRM_REF: ${{ inputs.confirm_project_ref }}
      MODE: ${{ inputs.mode }}
    steps:
      - name: Refuse anything but the configured staging project
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          set -euo pipefail
          [ -n "$STAGING_DB_URL" ] || { echo "no STAGING_DB_URL secret in the cellr-staging environment"; exit 1; }
          [ -n "$STAGING_PROJECT_REF" ] || { echo "no STAGING_PROJECT_REF variable in the cellr-staging environment"; exit 1; }
          [ "$CONFIRM_REF" = "$STAGING_PROJECT_REF" ] || { echo "the typed ref is not the configured staging project"; exit 1; }
          case "$STAGING_DB_URL$STAGING_PROJECT_REF" in *vvelgyhbjfmjvxkzekyz*) echo "production: refused"; exit 1;; esac
          case "$MODE" in check|migrate|import|scan|ratings|ratings-verify|pool-check|perf16|perf16-cleanup|perf-ladder) ;; *) echo "unknown mode"; exit 1;; esac
          # the password on its own is masked too, should a tool ever print it apart from the URL
          PW=$(node -e 'try{process.stdout.write(decodeURIComponent(new URL(process.env.STAGING_DB_URL).password))}catch{}')
          if [ -n "$PW" ]; then echo "::add-mask::$PW"; fi
          echo "::add-mask::$STAGING_DB_URL"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Postgres client
        run: sudo apt-get install -y -qq postgresql-client >/dev/null
      - name: The X-Wines file from its official source (checksum-verified, never stored in the repository)
        if: inputs.mode == 'import' || inputs.mode == 'ratings'
        run: |
          set -euo pipefail
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/XWines_Full_100K_wines.csv" \
            "https://drive.usercontent.google.com/download?id=1uEEipmKNxdiKUAhjH-K14JOSQ2BLRFss&export=download&confirm=t"
          echo "eac2d812b5eb94264f3c4ee1764ccdacf764cdf1c2599c26e3832ed91a4662cc  $RUNNER_TEMP/XWines_Full_100K_wines.csv" | sha256sum -c --quiet
          echo "file verified: $(wc -c < "$RUNNER_TEMP/XWines_Full_100K_wines.csv") bytes"
      - name: The X-Wines ratings file from its official source (checksum-verified, never stored in the repository)
        if: inputs.mode == 'ratings'
        run: |
          set -euo pipefail
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/XWines_Full_21M_ratings.zip" \
            "https://drive.usercontent.google.com/download?id=1tI-3XOoD4w_hYMGgj6OXU3EUI8xMQgj2&export=download&confirm=t"
          echo "a413529da701761ce82af14932984ea9a7cbb90b33d8c179402522df110f71ac  $RUNNER_TEMP/XWines_Full_21M_ratings.zip" | sha256sum -c --quiet
          unzip -q -o "$RUNNER_TEMP/XWines_Full_21M_ratings.zip" XWines_Full_21M_ratings.csv -d "$RUNNER_TEMP"
          rm -f "$RUNNER_TEMP/XWines_Full_21M_ratings.zip"
          echo "847fb49139b7ebfc92c5745cc34e3efff9febea05e977e4332287afa2ea2ded2  $RUNNER_TEMP/XWines_Full_21M_ratings.csv" | sha256sum -c --quiet
          echo "ratings file verified: $(wc -c < "$RUNNER_TEMP/XWines_Full_21M_ratings.csv") bytes"
      - name: Run (${{ inputs.mode }})
        # below the job's limit, so the steps after it (the perf16 cleanup) still have time to run
        timeout-minutes: 75
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: bash scripts/catalog-tools/staging-pilot.sh "$MODE" "$RUNNER_TEMP/out" "$RUNNER_TEMP/XWines_Full_100K_wines.csv" "$RUNNER_TEMP/XWines_Full_21M_ratings.csv"
      - name: perf16 cleanup, whatever happened (also after a cancel or a timeout)
        # the script's own trap may be cut off when the job is cancelled; this step runs anyway (always())
        if: always() && inputs.mode == 'perf16'
        timeout-minutes: 5
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: bash scripts/catalog-tools/staging-pilot.sh perf16-cleanup "$RUNNER_TEMP/out-cleanup"
      - name: Remove the dataset from the runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/XWines_Full_100K_wines.csv" "$RUNNER_TEMP"/XWines_Full_21M_ratings.* "$RUNNER_TEMP/ratings-work"
      - name: Reduce the results, fail-closed, whatever happened before
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/out" ]; then
            (cd scripts/catalog-tools && pnpm --silent exec tsx redact-results.ts --dir "$RUNNER_TEMP/out") || rm -rf "$RUNNER_TEMP/out"
          fi
      - name: Results (counts and ranks only)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-${{ inputs.mode }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/out/*.json
            ${{ runner.temp }}/out/*.txt
          if-no-files-found: ignore
          retention-days: 30
