<!doctype html>
<meta charset="utf-8" />
<title>ocr eval</title>
<script src="/tesseract.min.js"></script>
<script type="module" src="/app-ocr.js"></script>
<script>
  // ---------- deterministic random ----------
  function rng(seed) {
    let s = seed >>> 0;
    return () => {
      s = (s + 0x6d2b79f5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- rendering a photographed label ----------
  // spec: { seed, W, H, lines: [{ text, font, size (fraction of label width), weight, style, spacing }], paper,
  //         frac, rotate, curve, blur, noise, quality, bg }
  function drawLabel(spec) {
    const lw = Math.round(spec.W * spec.frac);
    const lh = Math.round(lw * 1.3);
    const label = document.createElement("canvas");
    label.width = lw;
    label.height = lh;
    const c = label.getContext("2d");
    c.fillStyle = spec.paper;
    c.fillRect(0, 0, lw, lh);
    // a thin printed border, as many labels have
    c.strokeStyle = spec.ink;
    c.lineWidth = Math.max(1, lw * 0.004);
    c.strokeRect(lw * 0.04, lw * 0.04, lw * 0.92, lh - lw * 0.08);
    if (spec.ornament) ornament(c, lw, lh, spec);
    if (spec.lines.some((l) => l.at)) {
      c.fillStyle = spec.ink;
      for (const l of spec.lines) {
        const px = l.size * lw;
        c.font = `${l.style || "normal"} ${l.weight || 400} ${px}px "${l.font}"`;
        c.letterSpacing = `${(l.spacing || 0) * px}px`;
        c.textAlign = l.align || "center";
        c.fillText(l.text, l.at[0] * lw, l.at[1] * lh, lw * 0.86);
      }
      return label;
    }
    const total = spec.lines.reduce((s, l) => s + l.size * lw * 1.55, 0);
    let y = (lh - total) / 2;
    c.fillStyle = spec.ink;
    c.textAlign = "center";
    c.textBaseline = "alphabetic";
    for (const l of spec.lines) {
      const px = l.size * lw;
      y += px * 1.55;
      c.font = `${l.style || "normal"} ${l.weight || 400} ${px}px "${l.font}"`;
      c.letterSpacing = `${(l.spacing || 0) * px}px`;
      c.fillText(l.text, lw / 2, y - px * 0.4, lw * 0.86);
    }
    return label;
  }

  // a crest and a line drawing of vineyard hills, as many labels carry
  function ornament(c, lw, lh, spec) {
    const r = rng(spec.seed * 13 + 5);
    c.save();
    c.strokeStyle = spec.ink;
    c.globalAlpha = 0.55;
    c.lineWidth = Math.max(1, lw * 0.003);
    const kind = spec.ornament;
    if (kind === "crest" || kind === "both") {
      const cx = lw / 2, cy = lh * 0.16, R = lw * 0.08;
      c.beginPath(); c.arc(cx, cy, R, 0, Math.PI * 2); c.stroke();
      c.beginPath(); c.arc(cx, cy, R * 0.8, 0, Math.PI * 2); c.stroke();
      for (let k = 0; k < 6; k++) { c.beginPath(); c.moveTo(cx - R * 0.5, cy - R * 0.4 + k * R * 0.16); c.lineTo(cx + R * 0.5, cy - R * 0.4 + k * R * 0.16); c.stroke(); }
    }
    if (kind === "hills" || kind === "both") {
      const base = lh * (0.55 + r() * 0.1);
      for (let k = 0; k < 3; k++) {
        c.beginPath();
        for (let x = 0; x <= lw; x += lw / 60) {
          const y = base + k * lh * 0.04 - Math.sin(x / lw * Math.PI * (1 + k) + k) * lh * 0.05;
          x === 0 ? c.moveTo(x, y) : c.lineTo(x, y);
        }
        c.stroke();
      }
      // vine rows
      for (let x = lw * 0.1; x < lw * 0.9; x += lw * 0.04) { c.beginPath(); c.moveTo(x, base + lh * 0.1); c.lineTo(x + lw * 0.02, base + lh * 0.04); c.stroke(); }
    }
    c.restore();
  }

  function cylinder(label, curve) {
    // a label on a bottle: the middle faces the camera, the sides turn away (and get darker)
    const lw = label.width;
    const lh = label.height;
    const out = document.createElement("canvas");
    const maxT = curve; // radians each side
    const R = lw / 2 / maxT;
    const ow = Math.round(2 * R * Math.sin(maxT));
    out.width = ow;
    out.height = lh;
    const c = out.getContext("2d");
    for (let x = 0; x < ow; x++) {
      const t0 = Math.asin(Math.max(-1, Math.min(1, (x - ow / 2) / R)));
      const t1 = Math.asin(Math.max(-1, Math.min(1, (x + 1 - ow / 2) / R)));
      const u0 = lw / 2 + R * t0;
      const u1 = lw / 2 + R * t1;
      c.drawImage(label, u0, 0, Math.max(0.5, u1 - u0), lh, x, 0, 1, lh);
    }
    const g = c.createLinearGradient(0, 0, ow, 0);
    g.addColorStop(0, "rgba(0,0,0,0.35)");
    g.addColorStop(0.3, "rgba(0,0,0,0)");
    g.addColorStop(0.65, "rgba(255,255,255,0.08)");
    g.addColorStop(1, "rgba(0,0,0,0.35)");
    c.fillStyle = g;
    c.fillRect(0, 0, ow, lh);
    return out;
  }

  async function photograph(spec) {
    const r = rng(spec.seed * 7919 + 1);
    const canvas = document.createElement("canvas");
    canvas.width = spec.W;
    canvas.height = spec.H;
    const c = canvas.getContext("2d");
    const bg = c.createLinearGradient(0, 0, spec.W, spec.H);
    bg.addColorStop(0, spec.bg[0]);
    bg.addColorStop(1, spec.bg[1]);
    c.fillStyle = bg;
    c.fillRect(0, 0, spec.W, spec.H);
    let label = drawLabel(spec);
    if (spec.curve > 0) label = cylinder(label, spec.curve);
    c.save();
    c.translate(spec.W / 2 + (r() - 0.5) * spec.W * 0.08, spec.H / 2 + (r() - 0.5) * spec.H * 0.06);
    c.rotate((spec.rotate * Math.PI) / 180);
    if (spec.blur > 0) c.filter = `blur(${spec.blur}px)`;
    c.drawImage(label, -label.width / 2, -label.height / 2);
    c.restore();
    // uneven light
    const light = c.createRadialGradient(
      spec.W * (0.3 + r() * 0.4), spec.H * (0.2 + r() * 0.3), spec.W * 0.1,
      spec.W / 2, spec.H / 2, spec.W);
    light.addColorStop(0, "rgba(255,250,235,0.10)");
    light.addColorStop(1, `rgba(0,0,0,${0.1 + r() * 0.25})`);
    c.fillStyle = light;
    c.fillRect(0, 0, spec.W, spec.H);
    if (spec.noise > 0) {
      const img = c.getImageData(0, 0, spec.W, spec.H);
      const d = img.data;
      for (let i = 0; i < d.length; i += 4) {
        const n = (r() + r() + r() - 1.5) * spec.noise;
        d[i] += n;
        d[i + 1] += n;
        d[i + 2] += n;
      }
      c.putImageData(img, 0, 0);
    }
    return new Promise((res) => canvas.toBlob(res, "image/jpeg", spec.quality));
  }

  // ---------- the app's path: preparePhoto (lib/photo.ts) then shrink (features/scan/ocr.ts) ----------
  async function preparePhoto(file) {
    const bitmap = await createImageBitmap(file, { imageOrientation: "from-image" });
    const scale = Math.min(1, 1600 / Math.max(bitmap.width, bitmap.height));
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(bitmap.width * scale));
    canvas.height = Math.max(1, Math.round(bitmap.height * scale));
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    bitmap.close();
    return new Promise((res) => canvas.toBlob(res, "image/jpeg", 0.85));
  }
  async function shrink(photo, edge = 1280) {
    const bitmap = await createImageBitmap(photo);
    const scale = Math.min(1, edge / Math.max(bitmap.width, bitmap.height));
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(bitmap.width * scale));
    canvas.height = Math.max(1, Math.round(bitmap.height * scale));
    canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    bitmap.close();
    return canvas;
  }

  // ---------- the reader ----------
  let worker;
  window.init = async () => {
    worker = await Tesseract.createWorker("eng", Tesseract.OEM.LSTM_ONLY, {
      workerPath: "/ocr/worker.min.js",
      corePath: "/ocr/tesseract-core-simd-lstm.js",
      langPath: "/ocr",
      gzip: true,
      workerBlobURL: false,
    });
    return true;
  };

  const linesOf = (data) =>
    (data.blocks || []).flatMap((b) =>
      b.paragraphs.flatMap((p) =>
        p.lines.map((l) => ({
          text: l.text.trim(),
          bbox: l.bbox,
          words: l.words.map((w) => ({ text: w.text, conf: Math.round(w.confidence) })),
        })),
      ),
    );

  async function read(canvas, psm, extra = {}) {
    await worker.setParameters({ tessedit_pageseg_mode: psm, tessedit_char_whitelist: "", ...extra.params });
    const t = performance.now();
    const { data } = await worker.recognize(canvas, extra.rectangle ? { rectangle: extra.rectangle } : {}, {
      text: true,
      blocks: true,
    });
    return { text: data.text, lines: linesOf(data), ms: performance.now() - t };
  }

  // a line that may be a year printed alone: one short token holding a digit
  const digitLine = (t) => /^\S{2,7}$/.test(t) && /\d/.test(t);

  async function secondPass(canvas, sparse, params) {
    let text = sparse.text;
    let ms = 0;
    const out = [];
    for (const line of sparse.lines) {
      if (!digitLine(line.text)) continue;
      const { x0, y0, x1, y1 } = line.bbox;
      const h = y1 - y0;
      const pad = Math.round(h * 0.6);
      const rectangle = {
        left: Math.max(0, x0 - pad),
        top: Math.max(0, y0 - pad),
        width: Math.min(canvas.width, x1 + pad) - Math.max(0, x0 - pad),
        height: Math.min(canvas.height, y1 + pad) - Math.max(0, y0 - pad),
      };
      const again = await read(canvas, "7", { rectangle, params });
      ms += again.ms;
      const t = again.text.trim();
      out.push({ before: line.text, after: t });
      if (t) text = text.replace(line.text, t);
    }
    return { text, ms, rereads: out };
  }

  window.evalSample = async (spec, variants) => {
    const file = spec.jpeg
      ? new Blob([Uint8Array.from(atob(spec.jpeg), (c) => c.charCodeAt(0))], { type: "image/jpeg" })
      : await photograph(spec);
    const prepared = await preparePhoto(file);
    const canvas = await shrink(prepared);
    const res = { size: [canvas.width, canvas.height] };
    let sparse;
    if (variants.includes("sparse") || variants.some((v) => v.startsWith("sparse+") || v.startsWith("append-"))) {
      sparse = await read(canvas, "11");
      res.sparse = { text: sparse.text, ms: sparse.ms, lines: sparse.lines.map((l) => ({ text: l.text, words: l.words })) };
    }
    if (variants.includes("app")) {
      // the production module itself (features/scan/ocr.ts), default budget
      await window.app.warmOcr();
      const t = performance.now();
      const r = await window.app.readLabelText(prepared);
      res.app = { text: r?.text ?? "", ms: performance.now() - t, status: window.app.ocrStatus() };
    }
    if (variants.includes("auto")) {
      const a = await read(canvas, "3");
      res.auto = { text: a.text, ms: a.ms };
    }
    if (variants.includes("block")) {
      const a = await read(canvas, "6");
      res.block = { text: a.text, ms: a.ms };
    }
    if (variants.includes("sparse+line")) {
      const p = await secondPass(canvas, sparse, {});
      res["sparse+line"] = { text: p.text, ms: sparse.ms + p.ms, rereads: p.rereads };
    }
    if (variants.includes("sparse+digits")) {
      const p = await secondPass(canvas, sparse, { tessedit_char_whitelist: "0123456789" });
      res["sparse+digits"] = { text: p.text, ms: sparse.ms + p.ms, rereads: p.rereads };
    }
    // "append" strategies: re-read each short digit line and add what was read as extra lines (never replace)
    for (const v of variants) {
      const m = /^append-(full3|crop(\d+)-p([\d.]+)(?:-x([\d.]+))?)$/.exec(v);
      if (!m) continue;
      let extra = "";
      let ms = sparse.ms;
      const digit = sparse.lines.filter((l) => digitLine(l.text));
      if (digit.length > 0 && m[1] === "full3") {
        const a = await read(canvas, "3");
        ms += a.ms;
        extra = a.lines.filter((l) => digitLine(l.text)).map((l) => l.text).join("\n");
      } else if (digit.length > 0) {
        const psm = m[2];
        const padY = Number(m[3]);
        const padX = Number(m[4] ?? m[3]);
        const got = [];
        for (const line of digit) {
          const { x0, y0, x1, y1 } = line.bbox;
          const h = y1 - y0;
          const left = Math.max(0, Math.round(x0 - h * padX));
          const top = Math.max(0, Math.round(y0 - h * padY));
          const rectangle = {
            left, top,
            width: Math.min(canvas.width, Math.round(x1 + h * padX)) - left,
            height: Math.min(canvas.height, Math.round(y1 + h * padY)) - top,
          };
          const a = await read(canvas, psm, { rectangle });
          ms += a.ms;
          got.push(...a.lines.filter((l) => digitLine(l.text)).map((l) => l.text));
        }
        extra = got.join("\n");
      }
      res[v] = { text: extra ? `${sparse.text}\n${extra}` : sparse.text, ms, rereads: extra ? [extra] : undefined, triggered: digit.length > 0 };
    }
    if (spec.keep) {
      res.image = await new Promise((r) => {
        const fr = new FileReader();
        fr.onload = () => r(fr.result);
        canvas.toBlob((b) => fr.readAsDataURL(b), "image/jpeg", 0.9);
      });
    }
    return res;
  };
</script>
